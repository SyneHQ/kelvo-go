schema_version = 1

[[bindings]]
name = "kelvo-node"
project = "REPLACE_PROJECT"
environment = "REPLACE_ENVIRONMENT"
application = "kelvo"
service = "node"
node = "hakopod-server"
seccomp = "unconfined"
privileged = true
# The entrypoint starts as root to delegate its cgroup subtree and install the
# egress rules, then drops to 65532 with no capabilities.
run_as_root = true

[bindings.sidecars.wireguard]
# Creates wg0 and replaces the pod's default route. No tun device: kernel
# WireGuard is configured over netlink.
capabilities = ["NET_ADMIN"]
run_as_root = true
