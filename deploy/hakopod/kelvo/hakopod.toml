operations:
  listen: ":8444"
  tls:
    cert_file: /run/kelvo/tls/internal.crt
    key_file: /run/kelvo/tls/internal.key
    ca_file: /run/kelvo/tls/internal-ca.crt
  inputs:
    shared:
      directory: /var/lib/kelvo/gateway/inputs
      max_entries: 64
      max_stored_bytes: 16777216
tenants:
  - policy:
      tenant_id: shared
      max_queries: 56
      job_ttl: 3m
      lease_duration: 15s
      replicas: 1
      limits:
        max_rows: 10000
        max_bytes: 4194304
        timeout: 60s
        memory_mb: 32
        threads: 1
        max_temp_mb: 128
        result_compression: lz4_frame
      workers: {local: 10}
      operations:
        shards: 8
        slots_per_shard: 4
        retention: 30m
        execution_timeout: 60s
      access:
        revision: 1
        principals:
          dbapi:
            kind: service
            operations:
              - connection.test
              - metadata.inspect
              - query.read
              - statement.execute
              - native.read
              - native.execute
              - schema.apply
              - migration.status
              - migration.apply
              - ingestion.install
              - ingestion.state
              - ingestion.commit
              - watch.install
              - watch.remove
              - watch.read
              - watch.ack
            delegated_resolver:
              issuer: db-api
              audience: kelvo-production
