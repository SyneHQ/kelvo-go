schema_version = 1
name = "kelvo"
# Image digests are printed in the hakopod-image workflow summary. Replace the
# all-zero digests (valid format, never pullable) before planning.

[volumes.nats-data]
size_gib = 5

[volumes.kelvo-state]
size_gib = 20


# kelvo-internal: nats, gateway and node only. No external egress.
[networks.kelvo-internal]
internal = true

# kelvo-gateway: shared segment so another application (db-api) can call the gateway.
[networks.kelvo-gateway]
internal = true
virtual_network = "kelvo-net"
segment = "gateway"

# kelvo-egress: gives the node external egress (database traffic). Hakopod
# blocks private and metadata CIDRs on it. The Tailscale exit-node routing
# for this traffic is pending Hakopod sidecar support; see README.
[networks.kelvo-egress]

[services.nats]
# Change to roll the service after its secrets change.
restart_nonce = "secrets-2026-10-22b"
image = "nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4"
port = 4222
networks = ["kelvo-internal"]
replicas = 1
update_strategy = "recreate"
run_as_user = 10001
args = ["-c", "/etc/nats/nats.conf"]
mounts = [{ volume = "nats-data", mount_path = "/data" }]


# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.nats.resources]
cpu_request = "25m"
[services.nats.secrets]
KELVO_TEST_NATS_PROVISIONER_PASSWORD = { ref = "kelvo-nats-provisioner-password" }
KELVO_TEST_NATS_GATEWAY_PASSWORD = { ref = "kelvo-nats-gateway-password" }
KELVO_TEST_NATS_WORKER_PASSWORD = { ref = "kelvo-nats-worker-password" }

[services.nats.files.conf]
mount_path = "/etc/nats/nats.conf"
content = """
server_name: kelvo-test
listen: 0.0.0.0:4222
max_payload: 2097152
tls {
  cert_file: /run/nats/tls/server.crt
  key_file: /run/nats/tls/server.key
  min_version: "1.3"
}
jetstream {
  store_dir: /data/jetstream
  max_file_store: 2147483648
  max_memory_store: 67108864
}
accounts {
  kelvo-test {
    jetstream { max_memory: 16777216, max_file: 1073741824, max_streams: 6, max_consumers: 8 }
    users = [
      {user: kelvo-test-provisioner, password: $KELVO_TEST_NATS_PROVISIONER_PASSWORD}
      {user: kelvo-test-gateway, password: $KELVO_TEST_NATS_GATEWAY_PASSWORD}
      {user: kelvo-test-worker, password: $KELVO_TEST_NATS_WORKER_PASSWORD}
    ]
  }
}
"""

[services.nats.files.crt]
mount_path = "/run/nats/tls/server.crt"
secret = { ref = "kelvo-nats-crt" }
mode = 292

[services.nats.files.key]
mount_path = "/run/nats/tls/server.key"
secret = { ref = "kelvo-nats-key" }
mode = 292

[services.cluster-init]
# Change to roll the service after its secrets change.
restart_nonce = "secrets-2026-10-22b"
image = "ghcr.io/synehq/kelvo-go@sha256:4c20925eab0fba3ccce1ebaf144b053cdabc58013a0a04c945aac4d57385b1b0"
registry_credential = "ghcr"
# A new pod's network policy is programmed a few seconds after it starts, and
# cluster-init connects to NATS once, at once. Wait before connecting.
command = ["/bin/sh", "-c", "sleep 10; exec /usr/local/bin/kelvo cluster-init --config /etc/kelvo/bootstrap.yml"]
depends_on = ["nats"]
networks = ["kelvo-internal"]
run_as_user = 65532
run_as_group = 65532
fs_group = 65532
temporary_mounts = [{ mount_path = "/tmp", size_mib = 64 }]


# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.cluster-init.resources]
cpu_request = "20m"
[services.cluster-init.job]
timeout_seconds = 120
retries = 1

[services.cluster-init.secrets]
KELVO_TEST_NATS_PROVISIONER_PASSWORD = { ref = "kelvo-nats-provisioner-password" }
KELVO_TEST_API_TOKEN = { ref = "kelvo-api-token" }

[services.cluster-init.files.bootstrap]
mount_path = "/etc/kelvo/bootstrap.yml"
content = """
listen: ":8443"
tls:
  cert_file: /run/kelvo/tls/api.crt
  key_file: /run/kelvo/tls/api.key
worker_tls:
  cert_file: /run/kelvo/tls/client.crt
  key_file: /run/kelvo/tls/client.key
  ca_file: /run/kelvo/tls/worker-ca.crt
max_queries: 8
max_concurrent: 2
max_http_requests: 32
tenants:
  - token_env: KELVO_TEST_API_TOKEN
    policy:
      tenant_id: kelvo-test
      max_queries: 8
      job_ttl: 10m
      lease_duration: 15s
      replicas: 1
      limits:
        max_rows: 1000000
        max_bytes: 134217728
        timeout: 30s
        memory_mb: 128
        threads: 2
        max_temp_mb: 256
      workers: {n1: 1}
    nats:
      url: tls://nats:4222
      username: kelvo-test-provisioner
      password_env: KELVO_TEST_NATS_PROVISIONER_PASSWORD
      ca_file: /run/kelvo/tls/nats-ca.crt
    workers:
      - {id: n1, url: "https://node:8443"}
"""

[services.cluster-init.files.nats-ca]
mount_path = "/run/kelvo/tls/nats-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 288

[services.cluster-init.files.client-crt]
mount_path = "/run/kelvo/tls/client.crt"
secret = { ref = "kelvo-gateway-client-crt" }
mode = 288

[services.cluster-init.files.client-key]
mount_path = "/run/kelvo/tls/client.key"
secret = { ref = "kelvo-gateway-client-key" }
mode = 288

[services.cluster-init.files.worker-ca]
mount_path = "/run/kelvo/tls/worker-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 288

[services.cluster-init.files.api-crt]
mount_path = "/run/kelvo/tls/api.crt"
secret = { ref = "kelvo-api-crt" }
mode = 288

[services.cluster-init.files.api-key]
mount_path = "/run/kelvo/tls/api.key"
secret = { ref = "kelvo-api-key" }
mode = 288

[services.gateway]
# Change to roll the service after its secrets change.
restart_nonce = "secrets-2026-10-22b"
image = "ghcr.io/synehq/kelvo-go@sha256:4c20925eab0fba3ccce1ebaf144b053cdabc58013a0a04c945aac4d57385b1b0"
registry_credential = "ghcr"
command = ["/usr/local/bin/kelvo"]
args = ["gateway", "--config", "/etc/kelvo/gateway.yml"]
port = 8443
size = "medium"
replicas = 1
depends_on = ["nats", "cluster-init"]
networks = ["kelvo-internal", "kelvo-gateway"]
run_as_user = 65532
run_as_group = 65532
fs_group = 65532
read_only_root_filesystem = true
temporary_mounts = [{ mount_path = "/tmp", size_mib = 64 }]

# Only db-api in the syne application may call the gateway.

# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.gateway.resources]
cpu_request = "30m"
[services.gateway.network_access]
from = []
from_applications = ["syne/db-api"]

[services.gateway.secrets]
KELVO_TEST_API_TOKEN = { ref = "kelvo-api-token" }
KELVO_TEST_NATS_GATEWAY_PASSWORD = { ref = "kelvo-nats-gateway-password" }

[services.gateway.files.config]
mount_path = "/etc/kelvo/gateway.yml"
content = """
listen: ":8443"
tls:
  cert_file: /run/kelvo/tls/api.crt
  key_file: /run/kelvo/tls/api.key
worker_tls:
  cert_file: /run/kelvo/tls/client.crt
  key_file: /run/kelvo/tls/client.key
  ca_file: /run/kelvo/tls/worker-ca.crt
max_queries: 8
max_concurrent: 2
max_http_requests: 32
tenants:
  - token_env: KELVO_TEST_API_TOKEN
    policy:
      tenant_id: kelvo-test
      max_queries: 8
      job_ttl: 10m
      lease_duration: 15s
      replicas: 1
      limits:
        max_rows: 1000000
        max_bytes: 134217728
        timeout: 30s
        memory_mb: 128
        threads: 2
        max_temp_mb: 256
      workers: {n1: 1}
    nats:
      url: tls://nats:4222
      username: kelvo-test-gateway
      password_env: KELVO_TEST_NATS_GATEWAY_PASSWORD
      ca_file: /run/kelvo/tls/nats-ca.crt
    workers:
      - {id: n1, url: "https://node:8443"}
"""

[services.gateway.files.api-crt]
mount_path = "/run/kelvo/tls/api.crt"
secret = { ref = "kelvo-api-crt" }
mode = 288

[services.gateway.files.api-key]
mount_path = "/run/kelvo/tls/api.key"
secret = { ref = "kelvo-api-key" }
mode = 288

[services.gateway.files.client-crt]
mount_path = "/run/kelvo/tls/client.crt"
secret = { ref = "kelvo-gateway-client-crt" }
mode = 288

[services.gateway.files.client-key]
mount_path = "/run/kelvo/tls/client.key"
secret = { ref = "kelvo-gateway-client-key" }
mode = 288

[services.gateway.files.worker-ca]
mount_path = "/run/kelvo/tls/worker-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 288

[services.gateway.files.nats-ca]
mount_path = "/run/kelvo/tls/nats-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 288

[services.node]
# Change to roll the service after its secrets change.
restart_nonce = "secrets-2026-10-22b"
image = "ghcr.io/synehq/kelvo-go-node@sha256:8bd9ff2fa2415abc63e0114fe86464ec7a9e2f8a9d3132572e88873d6b44293e"
# start.sh (below) prepares what a container cannot know in advance, then runs
# the image entrypoint.
command = ["/bin/sh", "/etc/kelvo/start.sh"]
registry_credential = "ghcr"
node_profile = "kelvo-node"
node_name = "hakopod-server"
replicas = 1
update_strategy = "recreate"
port = 8443
size = "large"
depends_on = ["nats", "cluster-init"]
# Joined to the egress network so database traffic can leave the pod.
networks = ["kelvo-internal", "kelvo-egress"]
# The entrypoint drops to 65532 itself; fs_group makes mounted secret files
# readable by that gid.
fs_group = 65532
mounts = [{ volume = "kelvo-state", mount_path = "/var/lib/kelvo" }]
temporary_mounts = [{ mount_path = "/tmp", size_mib = 64 }]

# WireGuard routes this pod's outbound traffic to the Oracle VM, whose public
# address the databases allow-list. The tunnel endpoint is the VM's tailnet
# address, reached through the host's own Tailscale (synehq-hakopod), so the VM
# opens no public port and the pod needs no tailnet device of its own.
# start.sh adds fail-closed rules for uid 65532: only loopback, the cluster
# CIDRs and wg0, so a down tunnel makes database connections fail instead of
# leaving from the server's address.
[[services.node.sidecars]]
name = "wireguard"
image = "linuxserver/wireguard:1.0.20260223-r0-ls126@sha256:6bcf5d2f5a265c7e9835eaadd989938e681aabe8bf8bcd4556b61d463da6555c"
cpu = "50m"
memory = "64Mi"
command = ["/bin/sh", "-c", """
set -eu
via=$(ip -4 route get 10.43.0.1 | sed -n 's/.* via \\([0-9.]*\\) dev \\([^ ]*\\).*/\\1 \\2/p')
gw=${via% *}; dev=${via#* }
ip link del wg0 2>/dev/null || true
ip link add wg0 type wireguard
printf '%s' "$WG_PRIVATE_KEY" | wg set wg0 private-key /dev/stdin peer "$WG_SERVER_PUBLIC_KEY" endpoint "$WG_ENDPOINT" allowed-ips 0.0.0.0/0 persistent-keepalive 25
ip addr add "$WG_ADDRESS" dev wg0
ip link set wg0 mtu 1200 up
for c in $(printf '%s' "$WG_KEEP_DIRECT" | tr ',' ' '); do ip route replace "$c" via "$gw" dev "$dev"; done
ip route replace default dev wg0
echo "wireguard: default route through wg0, endpoint $WG_ENDPOINT"
while :; do sleep 3600; done
"""]

[services.node.sidecars.env]
WG_ENDPOINT = "100.87.80.113:51820"
WG_SERVER_PUBLIC_KEY = "0jQwRvu2EDNTuPuRgIHvusfDrvZmks1R6+7IZ3hzoBg="
WG_ADDRESS = "10.99.0.2/32"
# Kept off the tunnel: pod and service CIDRs, and the endpoint itself.
WG_KEEP_DIRECT = "10.42.0.0/16,10.43.0.0/16,100.64.0.0/10"

[services.node.sidecars.secrets.WG_PRIVATE_KEY]
ref = "kelvo-wireguard-key"

# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.node.resources]
cpu_request = "60m"

[services.node.network_access]
from = ["gateway"]

[services.node.env]
# k3s defaults: pod CIDR and service CIDR. Check with
# kubectl cluster-info dump | grep -m1 cluster-cidr on the server.
KELVO_ALLOW_CIDRS = "10.42.0.0/16,10.43.0.0/16"
# Must match the sidecar WG_ENDPOINT.
KELVO_WG_ENDPOINT = "100.87.80.113:51820"

[services.node.secrets]
KELVO_TEST_NATS_WORKER_PASSWORD = { ref = "kelvo-nats-worker-password" }
# Source credentials: only KELVO_SOURCE_* names reach query child processes.
KELVO_SOURCE_POSTGRES_DSN = { ref = "kelvo-source-postgres-dsn" }

[services.node.files.start]
mount_path = "/etc/kelvo/start.sh"
content = """
#!/bin/sh
# Runs as root in the privileged node container, before the image entrypoint.
set -eu
# securityfs is not mounted in containers; the entrypoint reads the LSM list.
grep -q securityfs /proc/mounts || mount -t securityfs securityfs /sys/kernel/security
# The container sees the host cgroup tree, so its own cgroup path changes on
# every start. Write it into a copy of node.yml (containment.root = <cgroup>/jobs).
cg=/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)
sed "s#KELVO_CGROUP_JOBS#${cg%/}/jobs#" /etc/kelvo/node.yml > /tmp/node.yml
chmod 0644 /tmp/node.yml
# The pod network namespace outlives a container restart: drop the previous
# start's egress rules so the entrypoint can install them again.
for t in iptables ip6tables; do
  while "$t" -D OUTPUT -m owner --uid-owner 65532 -j KELVO_EGRESS 2>/dev/null; do :; done
  "$t" -F KELVO_EGRESS 2>/dev/null || true
  "$t" -X KELVO_EGRESS 2>/dev/null || true
done
# Fail-closed egress for uid 65532 (the node and its query children): loopback,
# the cluster CIDRs and the WireGuard interface only. IPv6 has no tunnel: reject.
iptables -N KELVO_EGRESS
iptables -A KELVO_EGRESS -o lo -j ACCEPT
iptables -A KELVO_EGRESS -o wg0 -j ACCEPT
# WireGuard sends the encrypted packet with the original socket's owner, so the
# tunnel's own UDP to the endpoint must be allowed for 65532 too.
iptables -A KELVO_EGRESS -d "${KELVO_WG_ENDPOINT%:*}" -p udp --dport "${KELVO_WG_ENDPOINT#*:}" -j ACCEPT
for c in $(printf '%s' "$KELVO_ALLOW_CIDRS" | tr ',' ' '); do iptables -A KELVO_EGRESS -d "$c" -j ACCEPT; done
iptables -A KELVO_EGRESS -j REJECT
iptables -I OUTPUT -m owner --uid-owner 65532 -j KELVO_EGRESS
ip6tables -N KELVO_EGRESS
ip6tables -A KELVO_EGRESS -o lo -j ACCEPT
ip6tables -A KELVO_EGRESS -j REJECT
ip6tables -I OUTPUT -m owner --uid-owner 65532 -j KELVO_EGRESS
# The rules above replace the image entrypoint's (which allow tailscale0).
KELVO_EGRESS=open exec /usr/local/bin/kelvo-node-entrypoint node --config /tmp/node.yml
"""

[services.node.files.config]
mount_path = "/etc/kelvo/node.yml"
content = """
listen: ":8443"
worker_id: n1
catalog_file: /etc/kelvo/catalog.yml
sandbox_path: /usr/local/bin/kelvo-landlock
scratch_directory: /var/lib/kelvo/scratch
tls:
  cert_file: /run/kelvo/tls/server.crt
  key_file: /run/kelvo/tls/server.key
  ca_file: /run/kelvo/tls/gateway-ca.crt
nats:
  url: tls://nats:4222
  username: kelvo-test-worker
  password_env: KELVO_TEST_NATS_WORKER_PASSWORD
  ca_file: /run/kelvo/tls/nats-ca.crt
resources:
  max_concurrent: 1
  memory_mb: 2048
  baseline_mb: 256
  overhead_mb: 224
  scratch_mb: 1024
containment:
  # Must equal <delegated cgroup>/jobs; the entrypoint prints it at startup.
  root: KELVO_CGROUP_JOBS
  state_directory: /var/lib/kelvo/containment
  native_overhead_mb: 64
  parent_overhead_mb: 32
  max_processes: 64
  max_groups: 64
  cleanup_timeout: 5s
policy:
  tenant_id: kelvo-test
  max_queries: 8
  job_ttl: 10m
  lease_duration: 15s
  replicas: 1
  limits:
    max_rows: 1000000
    max_bytes: 134217728
    timeout: 30s
    memory_mb: 128
    threads: 2
    max_temp_mb: 256
  workers: {n1: 1}
"""

[services.node.files.catalog]
mount_path = "/etc/kelvo/catalog.yml"
content = """
extension_directory: /opt/kelvo/extensions
sources:
  - id: pg
    type: postgres
    dsn_env: KELVO_SOURCE_POSTGRES_DSN
"""

[services.node.files.server-crt]
mount_path = "/run/kelvo/tls/server.crt"
secret = { ref = "kelvo-node-crt" }
mode = 288

[services.node.files.server-key]
mount_path = "/run/kelvo/tls/server.key"
secret = { ref = "kelvo-node-key" }
mode = 288

[services.node.files.gateway-ca]
mount_path = "/run/kelvo/tls/gateway-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 288

[services.node.files.nats-ca]
mount_path = "/run/kelvo/tls/nats-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 288
