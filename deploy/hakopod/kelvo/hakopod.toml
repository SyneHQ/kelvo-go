schema_version = 1
name = "kelvo"
# Production Kelvo (tenant "shared", worker "local", principal "dbapi"),
# moved from the Oracle VM. Gateway, node and resolver certificates are the
# production identity, issued for 127.0.0.1; relay sidecars keep those
# connections on 127.0.0.1 inside each pod, as on the VM.

[volumes.nats-data]
size_gib = 5

[volumes.kelvo-state]
size_gib = 20

[volumes.gateway-state]
size_gib = 2

# kelvo-internal: nats, gateway and node only. No external egress.
[networks.kelvo-internal]
internal = true

# kelvo-gateway: shared segment so db-api (application syne) can call the gateway.
[networks.kelvo-gateway]
internal = true
virtual_network = "kelvo-net"
segment = "gateway"

# kelvo-egress: external egress for the node (the WireGuard endpoint). db-api's
# resolver and rabbit (application syne) are reached through additional
# NetworkPolicies managed in the devops repository.
[networks.kelvo-egress]

[services.nats]
restart_nonce = "prod-2026-10-22a"
image = "nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4"
port = 4222
networks = ["kelvo-internal"]
replicas = 1
update_strategy = "recreate"
run_as_user = 10001
args = ["-c", "/etc/nats/nats.conf"]
mounts = [{ volume = "nats-data", mount_path = "/data" }]

# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.nats.resources]
cpu_request = "25m"

[services.nats.secrets]
KELVO_NATS_PROVISIONER_PASSWORD = { ref = "kelvo-nats-provisioner-password" }
KELVO_NATS_GATEWAY_PASSWORD = { ref = "kelvo-nats-gateway-password" }
KELVO_NATS_WORKER_PASSWORD = { ref = "kelvo-nats-worker-password" }

[services.nats.files.conf]
mount_path = "/etc/nats/nats.conf"
content = """
server_name: kelvo-shared
listen: 0.0.0.0:4222
max_payload: 1048576
max_pending: 4194304
max_connections: 32
write_deadline: "5s"
tls {
  cert_file: /run/nats/tls/server.crt
  key_file: /run/nats/tls/server.key
  min_version: "1.3"
  timeout: 3
}
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 16777216
  max_file_store: 268435456
}
accounts {
  shared_lz4 {
    jetstream { max_memory: 4194304, max_file: 67108864, max_streams: 7, max_consumers: 4 }
    users: [
      {
        user: gateway
        password: $KELVO_NATS_GATEWAY_PASSWORD
        permissions {
          publish: { allow: [
            "$JS.API.INFO", "$JS.API.STREAM.INFO.*",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_META",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_JOBS", "$KV.KELVO_JOBS.>",
            "$JS.API.CONSUMER.INFO.KELVO_QUEUE.dispatch", "job.ready",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_OPERATIONS_GATEWAY", "$KV.KELVO_OPERATIONS_GATEWAY.>"
          ] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      },
      {
        user: worker
        password: $KELVO_NATS_WORKER_PASSWORD
        permissions {
          publish: { allow: [
            "$JS.API.INFO", "$JS.API.STREAM.INFO.*",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_META",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_JOBS", "$KV.KELVO_JOBS.>",
            "$JS.API.CONSUMER.INFO.KELVO_QUEUE.dispatch",
            "$JS.API.CONSUMER.MSG.NEXT.KELVO_QUEUE.dispatch", "$JS.ACK.>",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_ACCEL_STATUS", "$KV.KELVO_ACCEL_STATUS.>",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_SOURCE_QUOTAS", "$KV.KELVO_SOURCE_QUOTAS.>",
            "acceleration.refresh", "$JS.API.CONSUMER.INFO.KELVO_ACCEL_QUEUE.refresh",
            "$JS.API.CONSUMER.MSG.NEXT.KELVO_ACCEL_QUEUE.refresh",
            "$JS.API.STREAM.MSG.GET.KV_KELVO_OPERATIONS_GATEWAY", "$KV.KELVO_OPERATIONS_GATEWAY.>"
          ] }
          subscribe: { allow: ["_INBOX.>"] }
        }
      },
      { user: provisioner, password: $KELVO_NATS_PROVISIONER_PASSWORD }
    ]
  }
}
"""

[services.nats.files.crt]
mount_path = "/run/nats/tls/server.crt"
secret = { ref = "kelvo-nats-crt" }
mode = 292

[services.nats.files.key]
mount_path = "/run/nats/tls/server.key"
secret = { ref = "kelvo-nats-key" }
mode = 292

[services.cluster-init]
restart_nonce = "prod-2026-10-22a"
image = "ghcr.io/synehq/kelvo-go@sha256:4c20925eab0fba3ccce1ebaf144b053cdabc58013a0a04c945aac4d57385b1b0"
registry_credential = "ghcr"
# A new pod's network policy is programmed a few seconds after it starts, and
# cluster-init connects to NATS once, at once. Wait before connecting.
command = ["/bin/sh", "-c", "sleep 10; mkdir -p /tmp/audit /tmp/inputs; exec /usr/local/bin/kelvo cluster-init --config /etc/kelvo/bootstrap.yml"]
depends_on = ["nats"]
networks = ["kelvo-internal"]
run_as_user = 65532
run_as_group = 65532
fs_group = 65532
temporary_mounts = [{ mount_path = "/tmp", size_mib = 64 }]

# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.cluster-init.resources]
cpu_request = "20m"

[services.cluster-init.job]
timeout_seconds = 120
retries = 1

[services.cluster-init.secrets]
KELVO_NATS_PROVISIONER_PASSWORD = { ref = "kelvo-nats-provisioner-password" }

[services.cluster-init.files.bootstrap]
mount_path = "/etc/kelvo/bootstrap.yml"
content = """
listen: ":8443"
tls:
  cert_file: /run/kelvo/tls/api.crt
  key_file: /run/kelvo/tls/api.key
worker_tls:
  cert_file: /run/kelvo/tls/internal.crt
  key_file: /run/kelvo/tls/internal.key
  ca_file: /run/kelvo/tls/internal-ca.crt
max_queries: 56
max_concurrent: 10
max_http_requests: 256
authentication:
  keys_file: /run/kelvo/tls/service-keys.yml
  reload_interval: 1s
  min_revision: 1
audit:
  service_id: gateway-local
  directory: /tmp/audit
  max_entries: 8192
  max_pending: 256
  retention: 1h
  write_timeout: 5s
operations:
  listen: ":8444"
  tls:
    cert_file: /run/kelvo/tls/internal.crt
    key_file: /run/kelvo/tls/internal.key
    ca_file: /run/kelvo/tls/internal-ca.crt
  inputs:
    shared:
      directory: /tmp/inputs
      max_entries: 64
      max_stored_bytes: 16777216
tenants:
  - policy:
      tenant_id: shared
      max_queries: 56
      job_ttl: 3m
      lease_duration: 15s
      replicas: 1
      limits:
        max_rows: 10000
        max_bytes: 4194304
        timeout: 60s
        memory_mb: 32
        threads: 1
        max_temp_mb: 128
        result_compression: lz4_frame
      workers: {local: 10}
      operations:
        shards: 8
        slots_per_shard: 4
        retention: 30m
        execution_timeout: 60s
      access:
        revision: 1
        principals:
          dbapi:
            kind: service
            operations:
              - connection.test
              - metadata.inspect
              - query.read
              - statement.execute
              - native.read
              - native.execute
              - schema.apply
              - migration.status
              - migration.apply
              - ingestion.install
              - ingestion.state
              - ingestion.commit
              - watch.install
              - watch.remove
              - watch.read
              - watch.ack
            delegated_resolver:
              issuer: db-api
              audience: kelvo-production
              url: https://127.0.0.1:9443/internal/kelvo/resolve
              public_key: CAp3b9q3V59Hzse81LbYfkbfJ94YFzmy5yPB9ciucRw=
    nats:
      url: tls://nats:4222
      username: provisioner
      password_env: KELVO_NATS_PROVISIONER_PASSWORD
      ca_file: /run/kelvo/tls/nats-ca.crt
    workers:
      - {id: local, url: "https://127.0.0.1:8445"}
"""

[services.cluster-init.files.api-crt]
mount_path = "/run/kelvo/tls/api.crt"
secret = { ref = "kelvo-api-crt" }
mode = 292

[services.cluster-init.files.api-key]
mount_path = "/run/kelvo/tls/api.key"
secret = { ref = "kelvo-api-key" }
mode = 288

[services.cluster-init.files.internal-crt]
mount_path = "/run/kelvo/tls/internal.crt"
secret = { ref = "kelvo-prod-gateway-internal-crt" }
mode = 292

[services.cluster-init.files.internal-key]
mount_path = "/run/kelvo/tls/internal.key"
secret = { ref = "kelvo-prod-gateway-internal-key" }
mode = 288

[services.cluster-init.files.internal-ca]
mount_path = "/run/kelvo/tls/internal-ca.crt"
secret = { ref = "kelvo-prod-internal-ca" }
mode = 292

[services.cluster-init.files.nats-ca]
mount_path = "/run/kelvo/tls/nats-ca.crt"
secret = { ref = "kelvo-ca-crt" }
mode = 292

[services.cluster-init.files.service-keys]
mount_path = "/run/kelvo/tls/service-keys.yml"
secret = { ref = "kelvo-prod-service-keys" }
mode = 288

[services.gateway]
restart_nonce = "prod-2026-10-22a"
image = "ghcr.io/synehq/kelvo-go@sha256:4c20925eab0fba3ccce1ebaf144b053cdabc58013a0a04c945aac4d57385b1b0"
registry_credential = "ghcr"
command = ["/usr/local/bin/kelvo"]
args = ["gateway", "--config", "/etc/kelvo/gateway.yml", "--drain-timeout", "30s"]
ports = [{ name = "api", port = 8443 }, { name = "operations", port = 8444 }]
replicas = 1
update_strategy = "recreate"
depends_on = ["nats", "cluster-init"]
networks = ["kelvo-internal", "kelvo-gateway"]
run_as_user = 65532
run_as_group = 65532
fs_group = 65532
mounts = [{ volume = "gateway-state", mount_path = "/var/lib/kelvo/gateway" }]
temporary_mounts = [{ mount_path = "/tmp", size_mib = 64 }]

# The gateway reaches the node as https://127.0.0.1:8445, the address its
# production certificate names; this relay forwards it to the node service.
[[services.gateway.sidecars]]
name = "relay"
image = "alpine/socat:1.8.1.3@sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842"
cpu = "20m"
memory = "32Mi"
command = ["socat", "TCP-LISTEN:8445,bind=127.0.0.1,fork,reuseaddr", "TCP:node:8443"]

# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.gateway.resources]
cpu_request = "30m"

[services.gateway.network_access]
from = ["node"]
from_applications = ["syne/db-api"]

[services.gateway.secrets]
KELVO_NATS_GATEWAY_PASSWORD = { ref = "kelvo-nats-gateway-password" }

[services.gateway.files.config]
mount_path = "/etc/kelvo/gateway.yml"
content = """
listen: ":8443"
tls:
  cert_file: /run/kelvo/tls/api.crt
  key_file: /run/kelvo/tls/api.key
worker_tls:
  cert_file: /run/kelvo/tls/internal.crt
  key_file: /run/kelvo/tls/internal.key
  ca_file: /run/kelvo/tls/internal-ca.crt
max_queries: 56
max_concurrent: 10
max_http_requests: 256
authentication:
  keys_file: /run/kelvo/tls/service-keys.yml
  reload_interval: 1s
  min_revision: 1
audit:
  service_id: gateway-local
  directory: /var/lib/kelvo/gateway/audit
  max_entries: 8192
