[services.node]
restart_nonce = "prod-2026-10-22a"
image = "ghcr.io/synehq/kelvo-go-node@sha256:8bd9ff2fa2415abc63e0114fe86464ec7a9e2f8a9d3132572e88873d6b44293e"
registry_credential = "ghcr"
# start.sh (below) prepares what a container cannot know in advance, then runs
# the image entrypoint.
command = ["/bin/sh", "/etc/kelvo/start.sh"]
node_profile = "kelvo-node"
node_name = "hakopod-server"
replicas = 1
update_strategy = "recreate"
port = 8443
size = "large"
depends_on = ["nats", "cluster-init"]
networks = ["kelvo-internal", "kelvo-egress"]
fs_group = 65532
mounts = [{ volume = "kelvo-state", mount_path = "/var/lib/kelvo" }]
temporary_mounts = [{ mount_path = "/tmp", size_mib = 64 }]

# WireGuard routes this pod's outbound traffic to the Oracle VM, whose public
# address the databases allow-list. The tunnel endpoint is the VM's tailnet
# address, reached through the host's own Tailscale (synehq-hakopod), so the VM
# opens no public port and the pod needs no tailnet device of its own.
# start.sh adds fail-closed rules for uid 65532: only loopback, the cluster
# CIDRs and wg0, so a down tunnel makes database connections fail instead of
# leaving from the server's address.
[[services.node.sidecars]]
name = "wireguard"
image = "linuxserver/wireguard:1.0.20260223-r0-ls126@sha256:6bcf5d2f5a265c7e9835eaadd989938e681aabe8bf8bcd4556b61d463da6555c"
cpu = "50m"
memory = "64Mi"
command = ["/bin/sh", "-c", """
set -eu
via=$(ip -4 route get 10.43.0.1 | sed -n 's/.* via \\([0-9.]*\\) dev \\([^ ]*\\).*/\\1 \\2/p')
gw=${via% *}; dev=${via#* }
ip link del wg0 2>/dev/null || true
ip link add wg0 type wireguard
printf '%s' "$WG_PRIVATE_KEY" | wg set wg0 private-key /dev/stdin peer "$WG_SERVER_PUBLIC_KEY" endpoint "$WG_ENDPOINT" allowed-ips 0.0.0.0/0 persistent-keepalive 25
ip addr add "$WG_ADDRESS" dev wg0
ip link set wg0 mtu 1200 up
for c in $(printf '%s' "$WG_KEEP_DIRECT" | tr ',' ' '); do ip route replace "$c" via "$gw" dev "$dev"; done
ip route replace default dev wg0
echo "wireguard: default route through wg0, endpoint $WG_ENDPOINT"
while :; do sleep 3600; done
"""]

[services.node.sidecars.env]
WG_ENDPOINT = "100.87.80.113:51820"
WG_SERVER_PUBLIC_KEY = "0jQwRvu2EDNTuPuRgIHvusfDrvZmks1R6+7IZ3hzoBg="
WG_ADDRESS = "10.99.0.2/32"
# Kept off the tunnel: pod and service CIDRs, and the endpoint itself.
WG_KEEP_DIRECT = "10.42.0.0/16,10.43.0.0/16,100.64.0.0/10"

[services.node.sidecars.secrets.WG_PRIVATE_KEY]
ref = "kelvo-wireguard-key"

# The node reaches db-api's resolver and the gateway's operations listener as
# 127.0.0.1, the addresses the production certificates name.
[[services.node.sidecars]]
name = "relay"
image = "alpine/socat:1.8.1.3@sha256:22d77becaeeea8ef56b8c4bb2312323acafe85354be6a85714ff5050e3537842"
cpu = "20m"
memory = "32Mi"
command = ["/bin/sh", "-c", "socat TCP-LISTEN:9443,bind=127.0.0.1,fork,reuseaddr TCP:db-api.hp-71b981e3dcd5a8c89c4934ed231efa3c.svc.cluster.local:9443 & exec socat TCP-LISTEN:8444,bind=127.0.0.1,fork,reuseaddr TCP:gateway:8444"]

# Small request so the app fits the single node's reservations; the
# profile limit still allows bursts.
[services.node.resources]
cpu_request = "60m"
memory_request = "768Mi"
memory_limit = "2Gi"

[services.node.network_access]
from = ["gateway"]

[services.node.env]
# Cluster CIDRs: NATS, gateway, db-api's resolver and rabbit's private transport.
KELVO_ALLOW_CIDRS = "10.42.0.0/16,10.43.0.0/16"
# Must match the wireguard sidecar's WG_ENDPOINT.
KELVO_WG_ENDPOINT = "100.87.80.113:51820"

[services.node.secrets]
KELVO_NATS_WORKER_PASSWORD = { ref = "kelvo-nats-worker-password" }

[services.node.files.start]
mount_path = "/etc/kelvo/start.sh"
content = """
#!/bin/sh
# Runs as root in the privileged node container, before the image entrypoint.
set -eu
# securityfs is not mounted in containers; the entrypoint reads the LSM list.
grep -q securityfs /proc/mounts || mount -t securityfs securityfs /sys/kernel/security
# The container sees the host cgroup tree, so its own cgroup path changes on
# every start. Write it into a copy of node.yml (containment.root = <cgroup>/jobs).
cg=/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)
sed "s#KELVO_CGROUP_JOBS#${cg%/}/jobs#" /etc/kelvo/node.yml > /tmp/node.yml
chmod 0644 /tmp/node.yml
# The pod network namespace outlives a container restart: drop the previous
# start's egress rules so the entrypoint can install them again.
for t in iptables ip6tables; do
  while "$t" -D OUTPUT -m owner --uid-owner 65532 -j KELVO_EGRESS 2>/dev/null; do :; done
  "$t" -F KELVO_EGRESS 2>/dev/null || true
  "$t" -X KELVO_EGRESS 2>/dev/null || true
done
# Fail-closed egress for uid 65532 (the node and its query children): loopback,
# the cluster CIDRs and the WireGuard interface only. IPv6 has no tunnel: reject.
iptables -N KELVO_EGRESS
iptables -A KELVO_EGRESS -o lo -j ACCEPT
iptables -A KELVO_EGRESS -o wg0 -j ACCEPT
# WireGuard sends the encrypted packet with the original socket's owner, so the
# tunnel's own UDP to the endpoint must be allowed for 65532 too.
iptables -A KELVO_EGRESS -d "${KELVO_WG_ENDPOINT%:*}" -p udp --dport "${KELVO_WG_ENDPOINT#*:}" -j ACCEPT
for c in $(printf '%s' "$KELVO_ALLOW_CIDRS" | tr ',' ' '); do iptables -A KELVO_EGRESS -d "$c" -j ACCEPT; done
iptables -A KELVO_EGRESS -j REJECT
iptables -I OUTPUT -m owner --uid-owner 65532 -j KELVO_EGRESS
ip6tables -N KELVO_EGRESS
ip6tables -A KELVO_EGRESS -o lo -j ACCEPT
ip6tables -A KELVO_EGRESS -j REJECT
ip6tables -I OUTPUT -m owner --uid-owner 65532 -j KELVO_EGRESS
# The rules above replace the image entrypoint's (which allow tailscale0).
KELVO_EGRESS=open exec /usr/local/bin/kelvo-node-entrypoint node --config /tmp/node.yml
"""

[services.node.files.config]
mount_path = "/etc/kelvo/node.yml"
content = """
listen: ":8443"
worker_id: local
catalog_file: /etc/kelvo/catalog.yml
sandbox_path: /usr/local/bin/kelvo-landlock
tls:
  cert_file: /run/kelvo/tls/internal.crt
  key_file: /run/kelvo/tls/internal.key
  ca_file: /run/kelvo/tls/internal-ca.crt
nats:
  url: tls://nats:4222
  username: worker
  password_env: KELVO_NATS_WORKER_PASSWORD
  ca_file: /run/kelvo/tls/nats-ca.crt
resources:
  max_concurrent: 12
  memory_mb: 1632
  baseline_mb: 96
  overhead_mb: 96
  scratch_mb: 1536
scratch_directory: /var/lib/kelvo/scratch
containment:
  # Must equal <delegated cgroup>/jobs; start.sh writes the real path.
  root: KELVO_CGROUP_JOBS
  state_directory: /var/lib/kelvo/containment
  native_overhead_mb: 48
  parent_overhead_mb: 16
  max_processes: 64
  max_groups: 48
  cleanup_timeout: 5s
audit:
  service_id: worker-local
  directory: /var/lib/kelvo/audit
  max_entries: 4096
  max_pending: 64
  retention: 1h
  write_timeout: 5s
connection_resolvers:
  db-api:
    # The relay sidecar forwards 127.0.0.1:9443 to db-api's resolver, so the
    # resolver URL and certificates stay those db-api already trusts.
