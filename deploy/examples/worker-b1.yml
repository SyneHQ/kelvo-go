listen: ":8443"
worker_id: b1
catalog_file: /etc/kelvo/catalog.yml
sandbox_path: /usr/local/bin/kelvo-landlock
tls:
  cert_file: /run/kelvo/tls/server.crt
  key_file: /run/kelvo/tls/server.key
  ca_file: /run/kelvo/tls/gateway-ca.crt
nats:
  url: tls://nats:4222
  username: tenant-b-worker
  password_env: KELVO_TENANT_B_NATS_PASSWORD
  ca_file: /run/kelvo/tls/nats-ca.crt
policy:
  tenant_id: tenant-b
  max_queries: 24
  job_ttl: 10m
  lease_duration: 15s
  replicas: 3
  limits:
    max_rows: 1000000
    max_bytes: 134217728
    timeout: 30s
    memory_mb: 512
    threads: 2
    max_temp_mb: 256
  workers: {b1: 1}
