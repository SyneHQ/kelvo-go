extension_directory: /opt/kelvo/extensions
sources:
  - id: sales
    type: csv
    path: /data/sales.csv
  - id: my
    type: mysql
    dsn_env: KELVO_SOURCE_MYSQL_DSN
  - id: ch
    type: clickhouse
    url_env: KELVO_SOURCE_CLICKHOUSE_URL
    username_env: KELVO_SOURCE_CLICKHOUSE_USER
    password_env: KELVO_SOURCE_CLICKHOUSE_PASSWORD
