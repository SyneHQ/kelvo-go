# Optional export additions to existing tenant-account user permissions.
# Merge allow lists; do not replace existing query/refresh/source-quota grants.
# Apply inside one tenant account. This YAML is a permission-block template,
# not a complete NATS server configuration or a credential document.
# Generated by: python3 scripts/nats_export_permissions.py --template
initializer:
  publish:
    allow:
      - "$JS.API.STREAM.INFO.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.STREAM.INFO.KELVO_EXPORT_QUEUE"
      - "$JS.API.STREAM.MSG.GET.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.CONSUMER.INFO.KELVO_EXPORT_QUEUE.exports"
      - "$JS.API.STREAM.CREATE.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.STREAM.CREATE.KELVO_EXPORT_QUEUE"
      - "$JS.API.STREAM.UPDATE.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.STREAM.UPDATE.KELVO_EXPORT_QUEUE"
      - "$JS.API.STREAM.DELETE.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.STREAM.DELETE.KELVO_EXPORT_QUEUE"
      - "$JS.API.CONSUMER.CREATE.KELVO_EXPORT_QUEUE.exports.export.ready"
      - "$JS.API.CONSUMER.DURABLE.CREATE.KELVO_EXPORT_QUEUE.exports"
      - "$JS.API.CONSUMER.DELETE.KELVO_EXPORT_QUEUE.exports"
gateway:
  publish:
    allow:
      - "$JS.API.STREAM.INFO.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.STREAM.INFO.KELVO_EXPORT_QUEUE"
      - "$JS.API.STREAM.MSG.GET.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.CONSUMER.INFO.KELVO_EXPORT_QUEUE.exports"
      - "$KV.KELVO_EXPORT_JOBS.export.*"
      - "export.ready"
worker:
  publish:
    allow:
      - "$JS.API.STREAM.INFO.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.STREAM.INFO.KELVO_EXPORT_QUEUE"
      - "$JS.API.STREAM.MSG.GET.KV_KELVO_EXPORT_JOBS"
      - "$JS.API.CONSUMER.INFO.KELVO_EXPORT_QUEUE.exports"
      - "$KV.KELVO_EXPORT_JOBS.export.*"
      - "$JS.API.CONSUMER.MSG.NEXT.KELVO_EXPORT_QUEUE.exports"
      - "$JS.ACK.KELVO_EXPORT_QUEUE.exports.>"
      - "$JS.ACK.*.*.KELVO_EXPORT_QUEUE.exports.>"
