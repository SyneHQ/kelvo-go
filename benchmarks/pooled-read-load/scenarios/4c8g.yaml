# Larger node: 4 vCPU, 8 GB.
# by scripts/pooled_read_load.py; these are the Kelvo settings run inside it.
# Secrets (source.password) and the proxy port are filled in by the runner.
policy:
  max_queries: 256
  job_ttl: 2m
  lease_duration: 5s
  replicas: 1
  workers: {a1: 64}        # node job permits for the query path
  limits: {max_rows: 1000000, max_bytes: 67108864, timeout: 30s, memory_mb: 32, threads: 1, max_temp_mb: 16}
resources:
  max_concurrent: 32
  memory_mb: 7000
  baseline_mb: 500
  overhead_mb: 64
  scratch_mb: 1024
  separate_classes: true
  query_reserve_slots: 28
  query_reserve_memory_mb: 5500
  query_reserve_scratch_mb: 768
containment: {max_groups: 128}
containment_budget: {native_overhead_mb: 16, parent_overhead_mb: 16, max_processes: 64}
warm_pool:
  enabled: true
  queue_depth: 64
  worker_memory_mb: 64
  cache_ttl: 10s
  reauthorize_every: 60s
read_workers:             # capacity of the read workers; pool_size is the adapter's source connections per worker
  max_workers: 4
  max_per_key: 1
  max_in_flight: 16
  pool_size: 4
  idle_ttl: 30m
  queue_wait: 10s
  stream_buffer_mb: 4
operations: {max_concurrent: 2, max_downloads: 2, max_result_bytes: 16777216}
gateway: {max_http_requests: 256}
audit: {max_entries: 262144, max_pending: 512}
resolver: {delay: 300ms, max_concurrent: 16}
source: {host: 127.0.0.1, port: 0, password: "", ca_pem: "", customers: 20}
sample_interval: 1s
