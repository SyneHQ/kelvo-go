schema_version: 1
title: TPC-H and TPC-DS scale ladder (derived, not audited TPC results)
status: measured
description: >-
  Query texts are DuckDB 1.5.6's bundled tpch_queries()/tpcds_queries(), written by
  `python3 scripts/tpc_benchmark.py export-sql` into benchmarks/tpc/<suite>/qNN.sql (not committed);
  the hashes below pin them. Data comes from DuckDB dbgen/dsdgen via `generate`.
ladder:
  tpch: [1, 10, 30]
  tpcds: [1, 10]
  tpch_sf100: not_run  # see docs/tpc-scale-benchmarks.md
systems:
  duckdb: DuckDB Python 1.5.6 over read_parquet views, Arrow IPC file output
  kelvo: kelvo query over parquet sources (federated mode), Arrow IPC file output
  kelvo_accel: kelvo query over accelerated Parquet snapshots of each table (SF1, SF10 only)
  trino: trinodb/trino:479, single node, Hive connector + file metastore over the same Parquet files
limits: {cgroup_memory_gib: 8, swap: 0, engine_memory_mb: 6144, threads: 4, query_timeout_s: 900, trials: 3}
answers:
  reference: DuckDB Python answer on the same Parquet
  exact: integers, strings, dates, NULLs, row count, column count
  numeric: |a-b| <= max(0.5 * 10^-scale of the coarser decimal side, 1e-9 * max(1,|a|,|b|))
  order: ordered compare first; tie reorder reported as matched_unordered
