name: Qualification build
# Builds the exact native release binaries for a qualification pair from the
# repository Dockerfile. Runs only on qual/** branches; publishes nothing.
on:
  push:
    branches: ['qual/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: new
            sha: a45556e
            bridge: '0'
            target: adapter-build
          - name: new-bridge
            sha: a45556e
            bridge: '1'
            target: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build from the release Dockerfile
        run: |
          full=$(git rev-parse "${{ matrix.sha }}^{commit}")
          git checkout -q "$full"
          docker buildx build --target ${{ matrix.target }} --build-arg DUCKBRIDGE=${{ matrix.bridge }} \
            --build-arg VERSION="$full" --load -t qual:${{ matrix.name }} .
          id=$(docker create qual:${{ matrix.name }})
          docker cp "$id:/out" out
          docker rm "$id"
          cd out
          rm -f kelvo-adapter-go.sha256 kelvo-adapter-relational.sha256
          sha256sum * | tee SHA256SUMS
          echo "$full" > SOURCE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kelvo-native-${{ matrix.name }}
          path: out/
          retention-days: 14
