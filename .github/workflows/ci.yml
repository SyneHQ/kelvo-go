name: Go
on:
  push:
    branches: [cargo]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Verify storage gate control flow
        run: python3 -m unittest discover -s scripts -p test_storage_conformance.py
      - name: Verify telemetry harness and formatter controls
        run: python3 -m unittest discover -s scripts/telemetry_overhead -p 'test_*.py'
      - name: Verify relational fixture evidence and cleanup
        run: python3 -m unittest discover -s scripts -p test_relational_acceptance.py
      - name: Verify analytical evidence reconciliation
        run: python3 scripts/test_analytics_evidence.py --campaign docs/evidence/analytics-azure-snapshot.json --validation docs/evidence/analytics-validation-measured.json
      - run: go test -tags duckdb_arrow ./...
      - run: go test -race ./internal/authfence ./internal/authstate ./internal/audit ./internal/access ./internal/containment ./internal/admission ./internal/telemetry ./internal/tracing ./internal/secrets ./internal/delegation ./federation ./internal/federation ./cmd/kelvo ./internal/httpstream ./internal/transport/httpapi ./internal/transportbroker/... ./internal/sources/... ./internal/cluster ./internal/worker ./internal/acceleration ./internal/catalog ./internal/objectstore ./internal/exports
      - name: Race-check schema and multipart object consumers
        run: go test -p 2 -race -tags duckdb_arrow ./internal/acceleration ./internal/engine/duckdb -run 'Test(SchemaEvolution|ObjectDescriptor|ObjectRange|ObjectMultipart(Commit|Empty|Seal|Descriptor|Lease|Ambiguous|Options|Root|Canceled)|MultipartRanges|MultipartObject|ExecuteMultipart)' -count=1 -timeout=10m
      - run: go vet -tags duckdb_arrow ./...
      - run: go build -tags duckdb_arrow -o bin/kelvo ./cmd/kelvo
      - run: cc -O2 -Wall -Wextra -Werror sandbox/launcher.c -o bin/kelvo-landlock
      - name: Verify containment evidence and cleanup controls
        run: python3 -m unittest discover -s scripts -p test_containment_acceptance.py
      - name: Verify delegated kernel containment and startup placement
        run: python3 scripts/containment_acceptance.py --go go --report artifacts/containment-ci.json
      - name: Verify sandboxed worker failure and snapshot recovery
        run: |
          KELVO_TEST_WORKER_BINARY="$PWD/bin/kelvo" KELVO_TEST_SANDBOX_BINARY="$PWD/bin/kelvo-landlock" \
            go test -p 2 -race -tags duckdb_arrow ./internal/cluster -run TestSandboxedWorkerFailurePreservesSnapshotAndAdmission -count=1 -timeout=5m
      - run: python3 -m pip install pyarrow==25.0.1
      - name: Verify Date32 live-fixture evidence and cleanup controls
        run: python3 -m unittest discover -s scripts -p test_federation_date32_acceptance.py
      - name: Install notebook acceptance tools
        run: python3 -m pip install -r notebooks/requirements.txt nbformat==5.10.4 nbclient==0.10.2 ipykernel==6.30.1
      - name: Verify notebook client and execution controls
        run: python3 -m unittest discover -s scripts -p 'test_*notebook*.py'
      - name: Fetch pinned public notebook datasets
        run: |
          python3 - <<'PYDATA'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'notebooks')
          from kelvo_notebooks import DATASETS, _download
          cache = Path('artifacts/notebook-data')
          cache.mkdir(parents=True, exist_ok=True)
          for name, (url, digest, limit) in DATASETS.items():
              _download(url, cache / name, limit, digest)
          PYDATA
      - name: Execute all fifteen public-data notebooks
        run: python3 scripts/notebook_acceptance.py --binary bin/kelvo --data-cache artifacts/notebook-data --output-dir artifacts/notebook-ci
      - name: Verify CSV memory comparison evidence controls
        run: python3 -m unittest discover -s scripts -p test_csv_memory_acceptance.py
      - name: Verify opt-in CSV buffers on a sandboxed worker
        run: |
          mkdir -p artifacts
          python3 scripts/csv_memory_acceptance.py --binary bin/kelvo --launcher bin/kelvo-landlock --output artifacts/csv-memory-ci.json
      - name: Verify snapshot backup evidence controls
        run: python3 -m unittest discover -s scripts -p test_backup_acceptance.py
      - name: Verify snapshot recovery after source and live-store loss
        run: |
          mkdir -p artifacts
          python3 scripts/backup_acceptance.py --binary bin/kelvo --launcher bin/kelvo-landlock --output artifacts/backup-ci.json
      - name: Verify local multipart CLI conformance
        run: python3 scripts/multipart_acceptance.py
      - name: Verify schema evolution CLI conformance
        run: python3 scripts/schema_evolution_acceptance.py
      - run: python3 scripts/acceptance.py
      - run: python3 scripts/test_cluster_fixture.py
      - run: python3 scripts/cluster_fixture.py provision
      - run: python3 scripts/cluster_fixture.py test-store --go go
      - run: python3 scripts/cluster_acceptance.py
      - run: python3 scripts/acceleration_acceptance.py --cluster
      - name: Verify operational evidence and HTTP integrity controls
        run: python3 -m unittest discover -s scripts -p test_operational_acceptance.py
      - name: Verify worker capacity evidence controls
        working-directory: scripts
        run: python3 -m unittest test_node_capacity_client test_node_capacity_worker test_summarize_node_capacity test_cleanup_coordinator
      - name: Verify mixed load, saturation, drain and recovery
        run: python3 scripts/operational_acceptance.py --binary bin/kelvo --sandbox bin/kelvo-landlock --duration 30 --output artifacts/operational-ci.json
      - name: Verify gateway key-rotation evidence controls
        run: python3 -m unittest discover -s scripts -p test_gateway_key_rotation_acceptance.py
      - name: Verify live overlapping keys and revocation on two gateways
        run: python3 scripts/gateway_key_rotation_acceptance.py --binary bin/kelvo --sandbox bin/kelvo-landlock --output artifacts/gateway-key-rotation-ci.json
      - name: Verify process-loss acceptance controls
        run: python3 -m unittest discover -s scripts -p test_process_loss_acceptance.py
      - name: Verify fenced-worker supervision controls
        run: python3 -m unittest discover -s scripts -p test_lease_supervision.py
      - name: Verify gateway, worker and broker crash recovery
        run: python3 scripts/process_loss_acceptance.py --binary bin/kelvo --sandbox bin/kelvo-landlock --fixture artifacts/cluster-private --managed-scratch --output artifacts/process-loss-ci.json
      - name: Verify rolling-upgrade evidence and source controls
        run: python3 scripts/test_rolling_upgrade_acceptance.py
      - name: Verify sustained acceptance evidence controls
        run: python3 -m unittest discover -s scripts -p test_sustained_acceptance.py
      - name: Verify broker and client compatibility evidence controls
        working-directory: scripts
        run: python3 -m unittest test_build_nats_compatibility test_config_refusal_acceptance test_nats_compatibility_acceptance
      - name: Verify release compatibility controls
        run: python3 -m unittest discover -s scripts -p test_release_upgrade_acceptance.py
      - name: Install checksum-pinned previous release fixture
        run: |
          python3 - <<'PYPREVIEW'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'notebooks')
          from kelvo_notebooks import install_binary
          os.environ.pop('KELVO_BINARY', None)
          root = Path('artifacts/preview-fixture')
          root.mkdir(parents=True, exist_ok=False)
          install_binary(root)
          PYPREVIEW
      - name: Verify preview and candidate snapshot compatibility
        run: python3 scripts/release_upgrade_acceptance.py --previous-binary artifacts/preview-fixture/kelvo --candidate-binary bin/kelvo --candidate-revision "$GITHUB_SHA" --launcher bin/kelvo-landlock --output artifacts/release-upgrades-ci.json
      - name: Retain sanitized notebook and operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-evidence
          path: |
            artifacts/notebook-ci/report.json
            artifacts/operational-ci.json
            artifacts/gateway-key-rotation-ci.json
            artifacts/process-loss-ci.json
            artifacts/containment-ci.json
            artifacts/release-upgrades-ci.json
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: python3 scripts/cluster_fixture.py stop

  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: true
      - run: python3 scripts/test_provision_duckbridge.py
      - run: python3 scripts/provision_duckbridge.py artifacts/duckbridge
      - name: Verify pinned Arrow bridge and native adapters
        run: |
          export CGO_CXXFLAGS="-I${GITHUB_WORKSPACE}/artifacts/duckbridge/headers"
          go test -p 2 -modfile artifacts/duckbridge/duckbridge.mod -tags duckdb_arrow,duckbridge ./...
          GOEXPERIMENT=cgocheck2 go test -p 2 -race -modfile artifacts/duckbridge/duckbridge.mod -tags duckdb_arrow,duckbridge ./internal/duckbridge ./internal/federation
          go vet -p 2 -modfile artifacts/duckbridge/duckbridge.mod -tags duckdb_arrow,duckbridge ./...
          go build -p 2 -modfile artifacts/duckbridge/duckbridge.mod -tags duckdb_arrow,duckbridge -o bin/kelvo ./cmd/kelvo
      - name: Verify local and object guards through real workers and revocation
        run: |
          export CGO_CXXFLAGS="-I${GITHUB_WORKSPACE}/artifacts/duckbridge/headers"
          cc -O2 -Wall -Wextra -Werror sandbox/launcher.c -o bin/kelvo-landlock
          KELVO_TEST_SNAPSHOT_BINARY="$PWD/bin/kelvo" KELVO_TEST_SNAPSHOT_SANDBOX="$PWD/bin/kelvo-landlock" \
            go test -p 2 -race -count=1 -timeout=5m -modfile artifacts/duckbridge/duckbridge.mod \
            -tags duckdb_arrow,duckbridge ./internal/worker ./internal/cluster \
            -run '^Test(Snapshot(WorkerSandboxPoliciesCancellationAndPinnedGeneration|PrincipalRealWorkerRevocationWithholdsEOS)|ObjectSnapshot(WorkerActualChild.*|PrincipalRealWorkerRevocationWithholdsEOS))$'
      - name: Verify export fixture and permission controls
        run: |
          python3 -m unittest discover -s scripts -p test_nats_export_permissions.py
          python3 -m unittest discover -s scripts -p test_export_diagnostics.py
      - name: Verify export child cancellation, quota and crash recovery
        run: |
          export CGO_CXXFLAGS="-I${GITHUB_WORKSPACE}/artifacts/duckbridge/headers"
          KELVO_TEST_EXPORT_BINARY="$PWD/bin/kelvo" KELVO_TEST_EXPORT_SANDBOX="$PWD/bin/kelvo-landlock" \
            go test -json -p 2 -race -count=1 -timeout=5m -modfile artifacts/duckbridge/duckbridge.mod \
            -tags duckdb_arrow,duckbridge ./internal/cluster \
            -run '^TestExportWorker(UsesSandboxAndExternalCustody|CancellationReapsSandboxAndReservations|SourceQuotaRejectsBeforeChildStart|SourceQuotaRevocationReapsChild|CrashAcrossLocalCommit)$' \
            | tee artifacts/export-workers.log
          python3 - <<'PYWORKERS'
          import json
          from pathlib import Path
          required = {'TestExportWorker' + name for name in (
              'UsesSandboxAndExternalCustody', 'CancellationReapsSandboxAndReservations',
              'SourceQuotaRejectsBeforeChildStart', 'SourceQuotaRevocationReapsChild',
              'CrashAcrossLocalCommit')}
          events = [json.loads(line) for line in Path('artifacts/export-workers.log').read_text().splitlines()]
          passed = {event.get('Test') for event in events if event.get('Action') == 'pass'}
          rejected = [event.get('Test', event.get('Package')) for event in events if event.get('Action') in ('fail', 'skip')]
          report = {'missing_required_tests': sorted(required - passed), 'failed_or_skipped': rejected}
          report['passed'] = not report['missing_required_tests'] and not rejected
          Path('artifacts/export-worker-gates.json').write_text(json.dumps(report, indent=2) + '\n')
          assert report['passed'], report
          PYWORKERS
      - name: Fetch checksum-pinned export brokers
        run: |
          python3 - <<'PYBROKER'
          import hashlib
          import io
          from pathlib import Path
          import sys
          import tarfile
          import urllib.request
          sys.path.insert(0, 'scripts')
          from cluster_fixture import RELEASES
          for version in ('2.14.7', '2.15.0'):
              root = Path('artifacts/export-brokers') / version
              root.mkdir(parents=True, exist_ok=False)
              url = f'https://github.com/nats-io/nats-server/releases/download/v{version}/nats-server-v{version}-linux-amd64.tar.gz'
              with urllib.request.urlopen(url, timeout=60) as response:
                  archive = response.read((64 << 20) + 1)
              assert len(archive) <= 64 << 20 and hashlib.sha256(archive).hexdigest() == RELEASES[version], 'broker checksum mismatch'
              with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
                  member = bundle.getmember(f'nats-server-v{version}-linux-amd64/nats-server')
                  assert member.isfile() and 0 < member.size <= 64 << 20, 'invalid broker member'
                  binary = bundle.extractfile(member).read()
              (root / 'nats-server').write_bytes(binary)
              (root / 'nats-server').chmod(0o700)
              (root / 'sha256').write_text(hashlib.sha256(binary).hexdigest() + '\n')
          PYBROKER
      - name: Verify protected-object containment evidence controls
        run: |
          python3 -B -m unittest discover -s scripts -p test_containment_acceptance.py
          python3 -B -m unittest discover -s scripts -p test_protected_query_acceptance.py
          python3 -B -m unittest discover -s scripts -p test_protected_export_acceptance.py
      - name: Verify authenticated queries through protected storage
        run: |
          mkdir -m 700 artifacts/containment-protected-private
          read -r broker_sha < artifacts/export-brokers/2.15.0/sha256
          python3 -B scripts/containment_acceptance.py --protected-objects --protected-queries --go go \
            --nats-server "$PWD/artifacts/export-brokers/2.15.0/nats-server" --nats-sha256 "$broker_sha" \
            --artifact-root "$PWD/artifacts/containment-protected-private/run" \
            --report artifacts/containment-protected-ci.json
      - name: Verify authenticated exports from protected storage
        run: |
          mkdir -m 700 artifacts/containment-export-private
          read -r broker_sha < artifacts/export-brokers/2.15.0/sha256
          python3 -B scripts/containment_acceptance.py --protected-objects --protected-exports --go go \
            --nats-server "$PWD/artifacts/export-brokers/2.15.0/nats-server" --nats-sha256 "$broker_sha" \
            --artifact-root "$PWD/artifacts/containment-export-private/run" \
            --report artifacts/containment-protected-export-ci.json
      - name: Retain protected-object containment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containment-protected-evidence
          path: |
            artifacts/containment-protected-ci.json
            artifacts/containment-protected-private/run/*.log
            artifacts/containment-protected-private/run/inside.json
            artifacts/containment-protected-private/run/live-service.json
            artifacts/containment-protected-private/run/run.json
            artifacts/containment-protected-private/run/broker-binary.json
            artifacts/containment-protected-private/run/query-broker/ownership.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain protected export containment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: containment-protected-export-evidence
          path: |
            artifacts/containment-protected-export-ci.json
            artifacts/containment-export-private/run/*.log
            artifacts/containment-export-private/run/inside.json
            artifacts/containment-export-private/run/live-service.json
            artifacts/containment-export-private/run/run.json
            artifacts/containment-export-private/run/broker-binary.json
            artifacts/containment-export-private/run/export-broker/ownership.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify export lifecycle with restricted broker roles
        run: |
          export CGO_CXXFLAGS="-I${GITHUB_WORKSPACE}/artifacts/duckbridge/headers"
          for version in 2.14.7 2.15.0; do
            broker="$PWD/artifacts/export-brokers/$version"
            for mode in acl lifecycle dispatch; do
              extra=()
              if [ "$mode" = lifecycle ]; then
                extra=(--export-binary "$PWD/bin/kelvo" --export-sandbox "$PWD/bin/kelvo-landlock")
              fi
              python3 scripts/export_broker_acceptance.py --mode "$mode" \
                --fixture "$PWD/artifacts/export-private-$version-$mode" \
                --nats-server "$broker/nats-server" --server-sha256 "$(cat "$broker/sha256")" \
                --server-version "$version" --go go --tags duckdb_arrow,duckbridge \
                --modfile artifacts/duckbridge/duckbridge.mod \
                --output "artifacts/export-$version-$mode.json" "${extra[@]}"
            done
          done
      - name: Retain sanitized export broker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: export-broker-evidence
          path: artifacts/export-*.json
          if-no-files-found: warn
          retention-days: 14

  warm-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            adapters/go/go.sum
      - name: Start a disposable PostgreSQL fixture
        run: |
          umask 077
          mkdir -p artifacts
          chmod 755 artifacts
          mkdir -m 700 artifacts/warm-private
          password=$(openssl rand -hex 16)
          docker run -d --name kelvo-warm-postgres -p 127.0.0.1:55432:5432 \
            -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=kelvo_fixture postgres:17.6 \
            -c shared_preload_libraries=pg_stat_statements >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec -e PGPASSWORD="$password" kelvo-warm-postgres \
                psql -h 127.0.0.1 -U postgres -d kelvo_fixture -Atc 'select 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec -e PGPASSWORD="$password" kelvo-warm-postgres psql -h 127.0.0.1 -U postgres -d kelvo_fixture -Atc 'select 1' >/dev/null
          printf 'postgres://postgres:%s@127.0.0.1:55432/kelvo_fixture?sslmode=disable&connect_timeout=5\n' "$password" > artifacts/warm-private/postgres.dsn
      - name: Build the adapter against this source
        run: |
          work=$(mktemp -d)
          export GOWORK="$work/go.work"
          (cd "$work" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/adapters/go")
          sdk_version=$(awk '$1 == "github.com/SYNEHQ/kelvo-go" { print $2 }' adapters/go/go.mod)
          test -n "$sdk_version"
          go work edit "-replace=github.com/SYNEHQ/kelvo-go@${sdk_version}=$GITHUB_WORKSPACE"
          go work edit "-replace=github.com/sijms/go-ora/v2@v2.9.0=$GITHUB_WORKSPACE/third_party/go-ora-v2.9.0"
          cd adapters/go
          go build -mod=readonly -p 2 -tags duckdb_arrow -trimpath \
            -o "$GITHUB_WORKSPACE/artifacts/warm-private/kelvo-adapter-go" ./cmd/kelvo-adapter-go
          # The slim read adapter: relational engines only, no DuckDB or cgo.
          CGO_ENABLED=0 go build -mod=readonly -p 2 -tags slim -trimpath -ldflags "-s -w" \
            -o "$GITHUB_WORKSPACE/artifacts/warm-private/kelvo-adapter-relational" ./cmd/kelvo-adapter-go
      - name: Verify one warm adapter reuses one PostgreSQL connection
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --adapter artifacts/warm-private/kelvo-adapter-go \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run
      - name: Verify one contained warm worker serves repeated requests
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedWarmWorkerServesRepeatedRequests \
            --adapter artifacts/warm-private/kelvo-adapter-go \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-repeated
      - name: Verify a skipped warm adapter gate fails
        run: python3 -m unittest discover -s scripts -p test_warm_adapter_acceptance.py
      # Read-worker gates below run on the slim relational adapter.
      - name: Replay an explorer page open through the node to one read worker
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedReadWorkerServesExplorerPageOpen \
            --adapter artifacts/warm-private/kelvo-adapter-relational \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-explorer
      - name: Read through the real Go client, gateway and node to a read worker
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --package ./internal/cluster --gate TestContainedReadWorkerThroughGoClient \
            --adapter artifacts/warm-private/kelvo-adapter-relational \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-client
      - name: Verify the warm pool's capacity contract on the real launcher
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedWarmPoolCapacityContract \
            --adapter artifacts/warm-private/kelvo-adapter-go \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-capacity
      - name: Size read workers and adapter pools from read_workers settings
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedReadWorkersSizeWorkersAndBackends \
            --adapter artifacts/warm-private/kelvo-adapter-relational \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-read-workers
      - name: Keep explorer p95 steady while the background class is full
        # Durable operations run one-shot, which only the full adapter has.
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedExplorerUnaffectedByFullBackgroundClass \
            --adapter artifacts/warm-private/kelvo-adapter-go \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-classes
      - name: Serve ten dashboard viewers with one source query per panel
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedDashboardViewersShareOneSourceQueryPerPanel \
            --adapter artifacts/warm-private/kelvo-adapter-relational \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-dashboard
      - name: Refuse a revoked or changed source within reauthorize_every
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedRevokedOrChangedSourceRefusedWithinReauthorization \
            --adapter artifacts/warm-private/kelvo-adapter-relational \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-reauthorize
      - name: Share one re-authorization under concurrency and a cancelled caller
        run: |
          python3 scripts/warm_adapter_acceptance.py --go go \
            --gate TestContainedConcurrentReauthorizationKeepsWorker \
            --adapter artifacts/warm-private/kelvo-adapter-relational \
            --postgres-dsn-file artifacts/warm-private/postgres.dsn \
            --output artifacts/warm-private/run-reauthorize-concurrent
      - name: Verify 50 concurrent reads share one bounded PostgreSQL pool
        run: |
          work=$(mktemp -d)
          export GOWORK="$work/go.work"
          (cd "$work" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/adapters/go")
          sdk_version=$(awk '$1 == "github.com/SYNEHQ/kelvo-go" { print $2 }' adapters/go/go.mod)
          go work edit "-replace=github.com/SYNEHQ/kelvo-go@${sdk_version}=$GITHUB_WORKSPACE"
          go work edit "-replace=github.com/sijms/go-ora/v2@v2.9.0=$GITHUB_WORKSPACE/third_party/go-ora-v2.9.0"
          cd adapters/go
          gate=TestServeLoop_ConcurrentPostgresReadsShareBoundedPool
          for tags in "" "-tags slim"; do
            KELVO_TEST_WARM_POSTGRES_DSN=$(cat "$GITHUB_WORKSPACE/artifacts/warm-private/postgres.dsn") \
              go test $tags -race -count=1 -v -run "^${gate}\$" ./internal/runtime | tee -a "$GITHUB_WORKSPACE/artifacts/warm-private/concurrent.log"
          done
          test "$(grep -c "^--- PASS: ${gate}" "$GITHUB_WORKSPACE/artifacts/warm-private/concurrent.log")" = 2
      - name: Measure the full and the slim adapter as warm workers
        run: |
          work=$(mktemp -d)
          export GOWORK="$work/go.work"
          (cd "$work" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/adapters/go")
          sdk_version=$(awk '$1 == "github.com/SYNEHQ/kelvo-go" { print $2 }' adapters/go/go.mod)
          go work edit "-replace=github.com/SYNEHQ/kelvo-go@${sdk_version}=$GITHUB_WORKSPACE"
          go work edit "-replace=github.com/sijms/go-ora/v2@v2.9.0=$GITHUB_WORKSPACE/third_party/go-ora-v2.9.0"
          cd adapters/go
          : > "$GITHUB_WORKSPACE/artifacts/warm-private/footprint.log"
          for binary in kelvo-adapter-go kelvo-adapter-relational; do
            KELVO_TEST_FOOTPRINT_ADAPTER="$GITHUB_WORKSPACE/artifacts/warm-private/$binary" \
            KELVO_TEST_WARM_POSTGRES_DSN=$(cat "$GITHUB_WORKSPACE/artifacts/warm-private/postgres.dsn") \
              go test -count=1 -v -run '^TestServeBinaryFootprint$' ./internal/runtime | tee -a "$GITHUB_WORKSPACE/artifacts/warm-private/footprint.log"
          done
          grep -c '^    footprint_test.go:[0-9]*: FOOTPRINT ' "$GITHUB_WORKSPACE/artifacts/warm-private/footprint.log" | grep -qx 2
          go version -m "$GITHUB_WORKSPACE/artifacts/warm-private/kelvo-adapter-relational" > "$GITHUB_WORKSPACE/artifacts/warm-private/slim-modules.txt"
          ! grep -Eiq 'duckdb|mongo|aws-sdk|go-ora|clickhouse|gocql' "$GITHUB_WORKSPACE/artifacts/warm-private/slim-modules.txt"
      - name: Retain the sanitized warm adapter report
        if: always()
        run: |
          mkdir -p artifacts/warm-adapter
          cp artifacts/warm-private/run/report.json artifacts/warm-private/run/worker.test.log artifacts/warm-adapter/ 2>/dev/null || true
          mkdir -p artifacts/warm-adapter/repeated
          cp artifacts/warm-private/run-repeated/report.json artifacts/warm-private/run-repeated/worker.test.log artifacts/warm-adapter/repeated/ 2>/dev/null || true
          mkdir -p artifacts/warm-adapter/explorer
          cp artifacts/warm-private/run-explorer/report.json artifacts/warm-private/run-explorer/worker.test.log artifacts/warm-adapter/explorer/
          mkdir -p artifacts/warm-adapter/client
          cp artifacts/warm-private/run-client/report.json artifacts/warm-private/run-client/worker.test.log artifacts/warm-adapter/client/ 2>/dev/null || true
          mkdir -p artifacts/warm-adapter/read-workers
          cp artifacts/warm-private/run-read-workers/report.json artifacts/warm-private/run-read-workers/worker.test.log artifacts/warm-adapter/read-workers/ 2>/dev/null || true
          mkdir -p artifacts/warm-adapter/classes
          cp artifacts/warm-private/run-classes/report.json artifacts/warm-private/run-classes/worker.test.log artifacts/warm-adapter/classes/ 2>/dev/null || true
          mkdir -p artifacts/warm-adapter/dashboard
          cp artifacts/warm-private/run-dashboard/report.json artifacts/warm-private/run-dashboard/worker.test.log artifacts/warm-adapter/dashboard/ 2>/dev/null || true
          for run in reauthorize reauthorize-concurrent; do
            mkdir -p "artifacts/warm-adapter/$run"
            cp "artifacts/warm-private/run-$run/report.json" "artifacts/warm-private/run-$run/worker.test.log" "artifacts/warm-adapter/$run/" 2>/dev/null || true
          done
          cp artifacts/warm-private/concurrent.log artifacts/warm-private/footprint.log artifacts/warm-private/slim-modules.txt artifacts/warm-adapter/ 2>/dev/null || true
          rm -f artifacts/warm-private/postgres.dsn
          docker rm -f -v kelvo-warm-postgres >/dev/null 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: warm-adapter-evidence
          path: artifacts/warm-adapter/
          if-no-files-found: warn
          retention-days: 14

  source-roundtrips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            adapters/go/go.sum
      - name: Start disposable PostgreSQL and MySQL fixtures
        run: |
          pg=$(openssl rand -hex 16)
          my=$(openssl rand -hex 16)
          echo "::add-mask::$pg"
          echo "::add-mask::$my"
          docker run -d --name kelvo-rt-postgres -p 127.0.0.1:55433:5432 \
            -e POSTGRES_PASSWORD="$pg" -e POSTGRES_DB=rt postgres:17.6 \
            -c shared_preload_libraries=pg_stat_statements >/dev/null
          docker run -d --name kelvo-rt-mysql -p 127.0.0.1:55434:3306 \
            -e MYSQL_ROOT_PASSWORD="$my" -e MYSQL_DATABASE=rt mysql:8.4 >/dev/null
          for attempt in $(seq 1 90); do
            if docker exec -e PGPASSWORD="$pg" kelvo-rt-postgres psql -h 127.0.0.1 -U postgres -d rt -Atc 'select 1' >/dev/null 2>&1 &&
               docker exec kelvo-rt-mysql mysql -h127.0.0.1 -uroot -p"$my" rt -e 'select 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec -e PGPASSWORD="$pg" kelvo-rt-postgres psql -h 127.0.0.1 -U postgres -d rt -Atc 'select 1' >/dev/null
          docker exec kelvo-rt-mysql mysql -h127.0.0.1 -uroot -p"$my" rt -e 'select 1' >/dev/null
          echo "KELVO_RT_POSTGRESQL=postgres:$pg@127.0.0.1:55433/rt" >> "$GITHUB_ENV"
          echo "KELVO_RT_MYSQL=root:$my@127.0.0.1:55434/rt" >> "$GITHUB_ENV"
      - name: Verify source round trips per read at an injected 80 ms RTT
        run: |
          set -o pipefail
          work=$(mktemp -d)
          export GOWORK="$work/go.work"
          (cd "$work" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/adapters/go")
          sdk_version=$(awk '$1 == "github.com/SYNEHQ/kelvo-go" { print $2 }' adapters/go/go.mod)
          go work edit "-replace=github.com/SYNEHQ/kelvo-go@${sdk_version}=$GITHUB_WORKSPACE"
          go work edit "-replace=github.com/sijms/go-ora/v2@v2.9.0=$GITHUB_WORKSPACE/third_party/go-ora-v2.9.0"
          cd adapters/go
          KELVO_RT_ASSERT=1 KELVO_RT_DELAY_MS=80 go test -race -count=1 -v -timeout 10m \
            -run 'TestReadRoundTripsLive|TestReadScenariosLive|TestPostgresReadSemanticsLive|TestPostgresDeadIdleConnectionsAreReplacedLive|TestPostgresStatementCountsSettleAfterBackgroundRollbackLive' \
            ./connectors/relational | grep -E "^(---|\s+---|ok|FAIL|panic)|ENGINE=|SCENARIO|_test.go"
      - name: Remove the fixtures
        if: always()
        run: docker rm -f -v kelvo-rt-postgres kelvo-rt-mysql >/dev/null 2>&1 || true
