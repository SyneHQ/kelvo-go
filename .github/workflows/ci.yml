name: Go
on:
  push:
    branches: [cargo]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go test -tags duckdb_arrow ./...
      - run: go test -race ./internal/transport/httpapi ./internal/sources/clickhouse
      - run: go vet -tags duckdb_arrow ./...
      - run: go build -tags duckdb_arrow -o bin/kelvo ./cmd/kelvo
      - run: python3 -m pip install pyarrow==25.0.1
      - run: python3 scripts/acceptance.py
