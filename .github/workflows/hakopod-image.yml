name: Hakopod images
on:
  push:
    branches: [cargo]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
concurrency:
  group: hakopod-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Gateway image (runtime target)
        id: gateway
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/synehq/kelvo-go:${{ github.sha }}
            ghcr.io/synehq/kelvo-go:${{ github.ref_name }}
      - name: Node image (hakopod-node target)
        id: node
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: hakopod-node
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/synehq/kelvo-go-node:${{ github.sha }}
            ghcr.io/synehq/kelvo-go-node:${{ github.ref_name }}
      - name: Print digests
        env:
          GATEWAY: ${{ steps.gateway.outputs.digest }}
          NODE: ${{ steps.node.outputs.digest }}
        run: |
          {
            echo "### Pushed images"
            echo
            echo '```text'
            echo "ghcr.io/synehq/kelvo-go@${GATEWAY}"
            echo "ghcr.io/synehq/kelvo-go-node@${NODE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
