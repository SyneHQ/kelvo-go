name: Release
# Tag push (v*): build linux/amd64 and linux/arm64 `runtime` and `worker`
# images on native runners, push them to GHCR, sign them keylessly with cosign,
# attach and attest an SPDX SBOM, attest build provenance, and publish the
# kelvo and kelvo-landlock binaries with SHA-256 sums on the GitHub release.
# workflow_dispatch is a dry run: it builds everything and pushes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  VERSION: ${{ github.ref_name }}
jobs:
  build:
    name: build ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [runtime, worker]
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {target: runtime, image: ghcr.io/synehq/kelvo}
          - {target: worker, image: ghcr.io/synehq/kelvo-worker}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CGO uses the target platform's compiler (see Dockerfile), so each
      # architecture builds on its own native runner. Images are pushed by
      # digest only; the publish job assembles the tagged manifest list.
      - name: Build image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
          provenance: false
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', matrix.image) || 'type=cacheonly' }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
      # The runtime image's two executables are the release binaries. Export
      # them from the cached build so they are byte-identical to the image.
      - name: Export binaries
        if: matrix.target == 'runtime'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          provenance: false
          outputs: type=local,dest=rootfs
      - name: Stage binaries
        if: matrix.target == 'runtime'
        run: |
          mkdir -p dist
          cp rootfs/usr/local/bin/kelvo "dist/kelvo-linux-${{ matrix.arch }}"
          cp rootfs/usr/local/bin/kelvo-landlock "dist/kelvo-landlock-linux-${{ matrix.arch }}"
          ls -l dist
      - if: matrix.target == 'runtime'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ matrix.target }}
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - {target: runtime, image: ghcr.io/synehq/kelvo}
          - {target: worker, image: ghcr.io/synehq/kelvo-worker}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.target }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        id: manifest
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          sources=""
          for d in digests/*; do sources="$sources $IMAGE@sha256:$(basename "$d")"; done
          tags="-t $IMAGE:$VERSION"
          case "$VERSION" in *-*) ;; *) tags="$tags -t $IMAGE:latest" ;; esac
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: cosign sign --yes "$REF"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.manifest.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach SBOM attestation (cosign)
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.target }}.spdx.json" "$REF"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom-${{ matrix.target }}.spdx.json
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Record digest
        env:
          REF: ${{ steps.manifest.outputs.ref }}
        run: |
          echo "$REF" > "image-${{ matrix.target }}.txt"
          { echo '```text'; echo "$REF"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            sbom-${{ matrix.target }}.spdx.json
            image-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{binaries,release}-*"
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- kelvo-linux-* kelvo-landlock-linux-* ./*.spdx.json | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kelvo-linux-*
            dist/kelvo-landlock-linux-*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          fence='```'
          notes="Images (signed with cosign keyless; SBOM and provenance attested):

          ${fence}text
          $(cat dist/image-runtime.txt)
          $(cat dist/image-worker.txt)
          ${fence}

          Verify: see docs/install.md#verify-a-release."
          notes=$(printf '%s\n' "$notes" | sed 's/^          //')
          if gh release view "$VERSION" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" -R "$REPO" --clobber dist/kelvo-* dist/*.spdx.json dist/SHA256SUMS
          else
            # shellcheck disable=SC2086
            gh release create "$VERSION" -R "$REPO" --verify-tag $prerelease --title "Kelvo $VERSION" --notes "$notes" \
              dist/kelvo-* dist/*.spdx.json dist/SHA256SUMS
          fi
