name: Pooled read profile
# Profiles ONE plain read (50 rows, warm read worker) end to end through the gateway's
# single-call path and the Go client, at low load and at 50 concurrent: wall time per
# stage, CPU and allocation profiles of the node and the adapter, worker memory, source
# round trips. 80 ms to the source, 300 ms per resolve. See docs/operations/profile-plain-read.md.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per window
        default: '60'
  pull_request:
    paths:
      - 'benchmarks/pooled-read-load/**'
      - 'scripts/pooled_read_load.py'
      - 'internal/cluster/pooled_read_load*'
      - 'adapters/go/internal/runtime/serve_profile_test.go'
      - '.github/workflows/pooled-read-profile.yml'
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            adapters/go/go.sum
      - name: Apply the measurement-only workarounds
        run: |
          # Each patch works around a product defect; none is a fix. Remove them when the defects are fixed.
          for p in benchmarks/pooled-read-load/patches/*.patch; do [ -e "$p" ] && git apply --check "$p" && git apply "$p"; done || true
      - name: Python dependencies
        run: python3 -c 'import yaml' || pip install --user pyyaml
      - name: Start a disposable PostgreSQL source
        run: |
          umask 077
          mkdir -p artifacts/load-private
          openssl rand -hex 16 > artifacts/load-private/pg.password
          docker run -d --name kelvo-load-postgres -p 127.0.0.1:55433:5432 \
            -e POSTGRES_PASSWORD="$(cat artifacts/load-private/pg.password)" postgres:17.6 \
            -c shared_preload_libraries=pg_stat_statements -c max_connections=400 -c fsync=off >/dev/null
          for attempt in $(seq 1 60); do
            docker exec -e PGPASSWORD="$(cat artifacts/load-private/pg.password)" kelvo-load-postgres \
              psql -h 127.0.0.1 -U postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Build the binaries under test
        run: |
          bin=$PWD/artifacts/load-private/bin
          mkdir -p "$bin"
          go build -tags duckdb_arrow -o "$bin/kelvo" ./cmd/kelvo
          cc -O2 -Wall -Wextra -Werror sandbox/launcher.c -o "$bin/kelvo-landlock"
          go test -c -tags duckdb_arrow -o "$bin/cluster.test" ./internal/cluster
          go build -o "$bin/loadgen" ./benchmarks/pooled-read-load/loadgen
          go build -o "$bin/latproxy" ./benchmarks/pooled-read-load/latproxy
          work=$(mktemp -d)
          export GOWORK="$work/go.work"
          (cd "$work" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/adapters/go")
          sdk_version=$(awk '$1 == "github.com/SYNEHQ/kelvo-go" { print $2 }' adapters/go/go.mod)
          go work edit "-replace=github.com/SYNEHQ/kelvo-go@${sdk_version}=$GITHUB_WORKSPACE"
          go work edit "-replace=github.com/sijms/go-ora/v2@v2.9.0=$GITHUB_WORKSPACE/third_party/go-ora-v2.9.0"
          (cd adapters/go && go build -mod=readonly -p 2 -tags duckdb_arrow -trimpath -o "$bin/kelvo-adapter-go" ./cmd/kelvo-adapter-go \
            && go test -c -mod=readonly -tags duckdb_arrow -o "$bin/adapter-profile.test" ./internal/runtime)
          ls -l "$bin/kelvo-adapter-go" > artifacts/load-private/adapter-size.txt
      - name: Profile one plain read
        run: |
          bin=$PWD/artifacts/load-private/bin
          python3 scripts/pooled_read_load.py --profile 4c8g --profile-plain --label plain-read \
            --duration "${{ inputs.duration || '60' }}" --output "$PWD/artifacts/load-private/run" \
            --postgres-password-file artifacts/load-private/pg.password \
            --kelvo "$bin/kelvo" --launcher "$bin/kelvo-landlock" --adapter "$bin/kelvo-adapter-go" \
            --cluster-test "$bin/cluster.test" --loadgen "$bin/loadgen" --latproxy "$bin/latproxy" \
            --adapter-profile-test "$bin/adapter-profile.test" \
            --set warm_pool.max_workers=20 --set warm_pool.cache_disabled=true
      - name: Retain the profile
        if: always()
        run: |
          mkdir -p artifacts/pooled-read-profile
          cd artifacts/load-private/run
          cp report.json node-report.json plain-*.json window-*.json window-*.pprof adapter-*.json adapter-*.pprof adapter-*.log latproxy.stats.json ../../pooled-read-profile/ 2>/dev/null || true
          cp ../adapter-size.txt ../../pooled-read-profile/ 2>/dev/null || true
          grep -av 'kelvo read failed' node.test.log | tail -c 100000 > ../../pooled-read-profile/node.test.log 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pooled-read-profile
          path: artifacts/pooled-read-profile/
          if-no-files-found: warn
          retention-days: 30
