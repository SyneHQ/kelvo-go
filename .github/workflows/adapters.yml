name: Operation adapters
on:
  push:
    branches: [cargo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            go.sum
            adapters/go/go.sum
      - name: Use the candidate SDK and adapter together
        run: |
          go work init . ./adapters/go
          sdk_version=$(awk '$1 == "github.com/SYNEHQ/kelvo-go" { print $2 }' adapters/go/go.mod)
          test -n "$sdk_version"
          go work edit "-replace=github.com/SYNEHQ/kelvo-go@${sdk_version}=."
          go work edit -replace=github.com/sijms/go-ora/v2@v2.9.0=./third_party/go-ora-v2.9.0
      - name: Verify the operation contracts
        run: go test -mod=readonly -race -count=1 ./operations ./adapter ./provider ./filesnapshot ./watch ./ingestion ./migration
      - name: Compile against the published SDK pin
        working-directory: adapters/go
        env:
          GOWORK: 'off'
        run: |
          go mod verify
          go build -mod=readonly -p 2 -tags duckdb_arrow -trimpath -o /tmp/kelvo-adapter-published-pin ./cmd/kelvo-adapter-go
      - name: Test and compile the optional worker
        working-directory: adapters/go
        run: |
          go mod verify
          go test -mod=readonly -p 2 -tags duckdb_arrow -count=1 -timeout=10m ./...
          go test -mod=readonly -p 2 -race -tags duckdb_arrow -count=1 -timeout=10m ./...
          go vet -mod=readonly -p 2 -tags duckdb_arrow ./...
          go build -mod=readonly -p 2 -tags duckdb_arrow -trimpath -o /tmp/kelvo-adapter-go ./cmd/kelvo-adapter-go
      - name: Test and compile the slim relational read adapter
        working-directory: adapters/go
        run: |
          go vet -mod=readonly -p 2 -tags slim ./cmd/... ./internal/runtime ./internal/frame
          go test -mod=readonly -p 2 -tags slim -count=1 -timeout=10m ./cmd/... ./internal/runtime ./internal/frame ./connectors/relational
          CGO_ENABLED=0 go build -mod=readonly -p 2 -tags slim -trimpath -ldflags "-s -w" -o /tmp/kelvo-adapter-relational ./cmd/kelvo-adapter-go
          ls -l /tmp/kelvo-adapter-go /tmp/kelvo-adapter-relational
          # The slim build must not carry the engines read workers never serve.
          if go version -m /tmp/kelvo-adapter-relational | grep -Eiq 'duckdb|mongo|aws-sdk|go-ora|clickhouse|gocql'; then
            go version -m /tmp/kelvo-adapter-relational; echo "slim adapter links an excluded engine"; exit 1
          fi
  jdbc-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: adapters/jdbc/pom.xml
      - name: Verify the contained JDBC runtime
        working-directory: adapters/jdbc
        run: mvn --batch-mode --no-transfer-progress verify
